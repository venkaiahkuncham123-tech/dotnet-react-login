name: reusable-workflow
on:
  push:
    branches: 
      - main
  workflow_dispatch: 
jobs:
  Build_job:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [19,20]
    steps:
      - name: git checkout
        uses: actions/checkout@v7
      - name: installing node
        uses: actions/setup-node@v7
        with:
          node-version: ${{matrix.version}}
      - name: Installing Dependencies
        run: npm ci
 
    
          
          
